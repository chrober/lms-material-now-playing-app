name: Export original icon palette reference
on:
  push:
    branches: [rename/lyrion-display-v0.2.0]
    paths: [.github/workflows/export-icon-reference-once.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Export original source icon as temporary workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: original-lyrion-icon-reference
          path: artwork/lyrion-now-playing-icon-source.webp
          if-no-files-found: error
          retention-days: 1
