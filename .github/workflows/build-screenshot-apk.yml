name: Signed screenshot test APK

on:
  push:
    branches:
      - rename/lyrion-display-v0.2.0
    paths:
      - .github/workflows/build-screenshot-apk.yml

permissions:
  contents: read

jobs:
  signed-test-apk:
    name: Build signed installable APK without publishing a release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_bin" && test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
          cache-provider: basic
      - name: Verify existing release signing secrets
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE" || -z "$RELEASE_STORE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Existing release signing secrets are not configured."
            exit 1
          fi
      - name: Restore existing release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
      - name: Verify classic PNG launcher icons
        run: python3 tools/verify_launcher_assets.py
      - name: Lint and unit tests
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest
      - name: Build signed APK using production certificate
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature and package resources
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          python3 tools/verify_launcher_assets.py app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -E "^package:|^application-label:"
      - name: Name screenshot test APK
        run: cp app/build/outputs/apk/release/app-release.apk lyrion-display-v0.2.0-screenshot.apk
      - name: Upload signed APK for screenshot testing (not a GitHub Release)
        uses: actions/upload-artifact@v7
        with:
          name: lyrion-display-v0.2.0-screenshot
          path: lyrion-display-v0.2.0-screenshot.apk
          retention-days: 14
          if-no-files-found: error
