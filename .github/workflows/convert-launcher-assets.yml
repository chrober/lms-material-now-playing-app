name: One-time Fire TV launcher icon conversion
on:
  push:
    branches:
      - rename/lyrion-display-v0.2.0
    paths:
      - .github/workflows/convert-launcher-assets.yml

permissions:
  contents: write

jobs:
  convert:
    if: github.repository == 'chrober/lms-material-now-playing-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Pillow for one-time binary conversion
        run: python -m pip install Pillow==11.3.0
      - name: Convert shipped launcher assets pixel-for-pixel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          res = Path('app/src/main/res')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for density, size in sizes.items():
              original = res / f'mipmap-{density}/ic_launcher.webp'
              dest = original.with_suffix('.png')
              if not original.is_file():
                  raise RuntimeError(f'Original icon missing: {original}')
              with Image.open(original) as img:
                  img.load()
                  if img.size != (size, size):
                      raise RuntimeError(f'{original}: expected {size}x{size}, got {img.size}')
                  img.save(dest, format='PNG', optimize=True)
              original.unlink()
              print(f'{original} -> {dest} ({size}x{size})')
          PY
      - name: Commit generated PNG files to rename branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app/src/main/res/mipmap-*
          if git diff --cached --quiet; then
            echo "No launcher asset changes"
            exit 0
          fi
          git commit -m "assets: convert legacy Fire TV launcher icons from WebP to PNG"
          git push origin HEAD:rename/lyrion-display-v0.2.0
