name: Publish Android release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'publish/v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build signed APK and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          # GitHub-hosted Ubuntu runners already have an Android SDK.
          # setup-android@v3 currently attempts to install the retired "tools" package.
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_bin" && test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
          cache-provider: basic
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/publish/v* ]]; then
            release_tag="${GITHUB_REF_NAME#publish/}"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          [[ "$release_tag" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]] || {
            echo "::error::Invalid release tag $release_tag"
            exit 1
          }
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          version=$(sed -nE "s/^[[:space:]]*versionName '([^']+)'.*$/\1/p" app/build.gradle)
          test -n "$version"
          test "$RELEASE_TAG" = "v$version" || {
            echo "::error::Tag $RELEASE_TAG does not match versionName $version"
            exit 1
          }
      - name: Verify signing secrets
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE" || -z "$RELEASE_STORE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD in repository secrets."
            exit 1
          fi
      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
      - name: Lint and test
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signed APK
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "lms-material-now-playing-${RELEASE_TAG}.apk"
          sha256sum "lms-material-now-playing-${RELEASE_TAG}.apk" > "lms-material-now-playing-${RELEASE_TAG}.apk.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "lms-material-now-playing-${RELEASE_TAG}.apk" \
            "lms-material-now-playing-${RELEASE_TAG}.apk.sha256" \
            --title "Lyrion Now Playing $RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --generate-notes
