name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build (API 22+)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          # GitHub-hosted Ubuntu runners already have an Android SDK.
          # setup-android@v3 currently attempts to install the retired "tools" package.
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_bin" && test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
          cache-provider: basic
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Name debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/lms-material-now-playing-debug.apk
      - name: Publish lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Publish debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lms-material-now-playing-debug
          path: app/build/outputs/apk/debug/lms-material-now-playing-debug.apk
          if-no-files-found: error
