name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build (API 22+)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: material-now-playing-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
