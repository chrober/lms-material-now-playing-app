name: Finish original TV banner replacement (one-time)
on:
  push:
    branches: [rename/lyrion-display-v0.2.0]
    paths: [.github/workflows/finish-banner-once.yml]
permissions:
  contents: write
jobs:
  banner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install Pillow==11.3.0 numpy==2.2.6
      - name: Recompose title on original untouched gradient
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import subprocess
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont

          original_bytes = subprocess.check_output([
              'git', 'show', 'origin/main:artwork/lyrion-now-playing-banner-source.webp'
          ])
          original = Image.open(BytesIO(original_bytes)).convert('RGB')
          assert original.size == (640, 360)
          src = np.asarray(original).astype(np.float32)
          result = src.copy()
          # Fill the full old title/anti-aliased shadow rectangle using
          # untouched scanlines at y=103 and y=159. Crucially, y=159 is
          # above the first equalizer bar, avoiding neon vertical streaks.
          x0, x1 = 215, 548
          top = np.mean(src[99:108, x0:x1], axis=0)
          bottom = np.mean(src[157:161, x0:x1], axis=0)
          for y in range(110, 163):
              f = min(1.0, max(0.0, (y - 103) / (159 - 103)))
              interpolated = top * (1-f) + bottom * f
              fade_y = min(1.0, (y - 109)/8.0, (163 - y)/5.0)
              for x in range(x0, x1):
                  fade_x = min(1.0, (x - x0)/10.0, (x1-x)/12.0)
                  alpha = min(1.0, max(0.0, min(fade_x,fade_y)))
                  result[y,x] = src[y,x] * (1-alpha) + interpolated[x-x0] * alpha
          
          banner = Image.fromarray(np.uint8(np.clip(result, 0, 255)), 'RGB')
          draw = ImageDraw.Draw(banner)
          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',29)
          draw.text((227, 119), 'Lyrion Display', font=font, fill=(252,251,255))
          source = Path('artwork/lyrion-display-banner-source.webp')
          target = Path('app/src/main/res/drawable-nodpi/tv_banner.webp')
          banner.save(source, format='WEBP', quality=96, method=6)
          banner.save(target, format='WEBP', quality=90, method=6)
          for path in [source, target]:
              with Image.open(path) as check:
                  assert check.size == (640, 360)
          print('OK: polished banner source and packaged TV resource')
          PY
      - name: Commit polished source + resource
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artwork/lyrion-display-banner-source.webp app/src/main/res/drawable-nodpi/tv_banner.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets: finalize clean Lyrion Display TV banner"
          git push origin HEAD:rename/lyrion-display-v0.2.0
