name: QA only - reproduce GitHub v0.3.0 with fdroidserver (NO SUBMISSION)

on:
  push:
    branches: [build/fdroid-v0.3.0-repro-20261121]
    paths: [.github/workflows/verify-v030-fdroid-qa.yml]

permissions:
  contents: read

jobs:
  reproduce-v030:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2639d8871c3d2102fcad55e5c37263e99ae96cb1
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable test harness and release source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "2639d8871c3d2102fcad55e5c37263e99ae96cb1"
          test "$(git rev-list -n 1 refs/tags/v0.3.0)" = "fb4cb6359e1931519f586d6602c25e9b95e51e03"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
          cache-provider: basic
      - name: Install F-Droid source/build and APK reproducibility tooling
        run: python3 -m pip install --disable-pip-version-check 'fdroidserver==2.4.5' PyYAML 'apksigcopier==1.1.1'
      - name: Check disabled exact-release metadata
        run: python3 tools/check_fdroid_recipe.py
      - name: Run F-Droid scanner and independent source build
        shell: bash
        run: |
          cd fdroid
          printf "sdk_path: '%s'\n" "$ANDROID_HOME" > config.yml
          printf "gradle: '%s'\n" "$(command -v gradle)" >> config.yml
          fdroid readmeta
          fdroid lint com.chrober.lmsmaterial.nowplaying
          mkdir -p build
          git clone --quiet --no-checkout https://github.com/chrober/lyrion-display.git build/com.chrober.lmsmaterial.nowplaying
          git -C build/com.chrober.lmsmaterial.nowplaying checkout --quiet fb4cb6359e1931519f586d6602c25e9b95e51e03
          test "$(git -C build/com.chrober.lmsmaterial.nowplaying rev-parse HEAD)" = "fb4cb6359e1931519f586d6602c25e9b95e51e03"
          set -o pipefail
          fdroid build --test --force --verbose com.chrober.lmsmaterial.nowplaying 2>&1 | tee fdroid-v030-verify.log
          test -s tmp/com.chrober.lmsmaterial.nowplaying_9.apk
          if grep -Eq '[1-9][0-9]* build(s)? failed' fdroid-v030-verify.log; then
            echo "::error::fdroidserver reported failed builds"
            exit 1
          fi
      - name: Verify official published GitHub APK and checksum
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            -o lyrion-display-v0.3.0.apk \
            https://github.com/chrober/lyrion-display/releases/download/v0.3.0/lyrion-display-v0.3.0.apk
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            -o lyrion-display-v0.3.0.apk.sha256 \
            https://github.com/chrober/lyrion-display/releases/download/v0.3.0/lyrion-display-v0.3.0.apk.sha256
          sha256sum -c lyrion-display-v0.3.0.apk.sha256
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs lyrion-display-v0.3.0.apk | tee signed-release-cert.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: af624ba3a730a5bf4a9d0b77e2bed2ec557744705362d4a4445e6dcb125f1dfb' signed-release-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging lyrion-display-v0.3.0.apk > release-badging.txt
          grep -Fq "name='com.chrober.lmsmaterial.nowplaying' versionCode='9' versionName='0.3.0'" release-badging.txt
      - name: Compare F-Droid APK to published developer-signed release
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          apksigcopier compare --unsigned \
            lyrion-display-v0.3.0.apk \
            fdroid/tmp/com.chrober.lmsmaterial.nowplaying_9.apk
          sha256sum fdroid/tmp/com.chrober.lmsmaterial.nowplaying_9.apk | tee unsigned-apk-sha256.txt
          echo "PASS: published v0.3.0 APK reproducible from exact tagged source using fdroidserver."
      - name: Upload verification logs only (no publication)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-v030-reproducibility-qa-evidence
          path: |
            fdroid/fdroid-v030-verify.log
            signed-release-cert.txt
            release-badging.txt
            unsigned-apk-sha256.txt
          retention-days: 14
          if-no-files-found: ignore
