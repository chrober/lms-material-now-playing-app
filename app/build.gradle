plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chrober.lmsmaterial.nowplaying'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chrober.lmsmaterial.nowplaying'
        minSdk 22
        targetSdk 35
        versionCode 8
        versionName '0.2.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    signingConfigs {
        production {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // F-Droid builds from source without the developer's private signing key.
            // Preserve production signing for GitHub releases when configured.
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.production
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json implementation is only a stub in host-side JVM tests.
    testImplementation 'org.json:json:20260814'
}
